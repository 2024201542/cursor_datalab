# ============================================================
# 多模型互检分类 配置文件
# 换分类任务时，只需要修改 task 部分；换模型时，只需要修改 models / arbiter 部分
# ============================================================

task:
  name: 客服消息意图分类
  description: 对电商平台用户发来的客服消息进行意图分类，每条消息只能归入一个类别。

  labels:
    - name: 投诉
      definition: 用户对商品、服务、物流或工作人员表达明显不满，核心诉求是发泄不满、要求道歉、追责或赔偿。
      examples:
        - 快递员态度极其恶劣，把包裹直接扔在门口
        - 客服一直不回消息，我要投诉
      counter_examples:
        - 质量不好，我要退货（核心诉求是办理售后，归为“售后”）

    - name: 咨询
      definition: 用户询问信息，例如价格、功能、物流进度、平台政策等，没有明显不满，也没有明确要求办理某项业务。
      examples:
        - 请问这款耳机支持降噪吗？
        - 退货的运费谁承担？
      counter_examples:
        - 我要退货，运费你们出（明确要求办理，归为“售后”）

    - name: 售后
      definition: 用户明确要求办理退货、换货、退款、维修等售后操作。
      examples:
        - 收到的屏幕有坏点，申请退货
        - 耳机左耳没声音，要求换货

    - name: 建议
      definition: 用户对产品、服务或平台功能提出改进意见或新需求。
      examples:
        - 建议 App 增加夜间模式
        - 希望以后包装能更环保一点

    - name: 其他
      definition: 无法归入以上任何类别的内容，例如闲聊、广告、无意义字符。
      examples:
        - 哈哈哈
        - 加我微信领红包

  # 边界规则：写清楚容易混淆的情况，是减少模型分歧最有效的手段
  rules:
    - 同时表达不满并要求退货/退款时，若核心诉求是办理售后操作，归为“售后”；若核心是发泄不满、要求道歉或赔偿，归为“投诉”。
    - 已经申请售后但对处理进度或结果不满的，归为“投诉”。
    - 只询问售后政策（例如“能不能退”“运费谁出”）而没有明确要求办理的，归为“咨询”。
    - 提建议时带有轻微抱怨，但主要内容是改进方案的，归为“建议”。

# ------------------------------------------------------------
# 参与互检的模型（建议 3 个，且来自不同厂商，避免犯同样的错）
# provider:
#   openai    -> 任何 OpenAI 兼容接口（OpenAI / DeepSeek / 通义千问 / 大部分中转站）
#   anthropic -> Anthropic 原生 /v1/messages 接口
#   mock      -> 假模型，不需要 API key，用来测试流程（也可以用命令行参数 --mock 一键切换）
# api_key_env: 从哪个环境变量读取 key（推荐）；也可以直接写 api_key（不推荐，容易泄露）
# weight: 投票权重；运行 evaluate 后会根据金标准准确率自动生成 output/weights.json
# mock_accuracy: 仅 mock 模式使用，模拟该模型的准确率
# extra_body: 透传给接口的额外参数，常用于关闭“思考模式”以提速
# max_concurrency / rpm: 该模型单独的并发上限、每分钟请求数上限（0 表示不限制）
# price_in / price_out: 输入 / 输出单价（元 / 百万 token），用于费用预估和统计；不填则只统计 token
#   下面的单价取自各家官网（2026-09 查询，DeepSeek 按工作日高峰价），价格可能变动，请以官网为准
# key 放在项目根目录的 .env 文件中（已被 .gitignore 忽略，不会上传）
# ------------------------------------------------------------
models:
  - name: deepseek
    provider: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-flash
    extra_body:
      thinking: {type: disabled}
    price_in: 2.0               # 空闲时段半价
    price_out: 8.0
    weight: 1.0
    mock_accuracy: 0.8

  # Kimi 通过阿里云百炼调用（与官方同一模型，限额更高）
  - name: kimi
    provider: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: kimi-k2.6
    price_in: 6.5
    price_out: 27.0
    weight: 1.0
    mock_accuracy: 0.8

  # Kimi 官方接口：当前账号限额为 并发 1 / 每分钟 3 次，账号升级后可启用本段并停用上一段
  - name: kimi-official
    provider: openai
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    model: kimi-k2.6
    temperature: 0.6            # 关闭思考时该模型只允许 0.6
    extra_body:
      thinking: {type: disabled}
    max_concurrency: 1
    rpm: 3
    enabled: false

  - name: qwen
    provider: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: qwen3.7-plus
    extra_body:
      enable_thinking: false
    price_in: 2.0
    price_out: 8.0
    weight: 1.0
    mock_accuracy: 0.8

# 仲裁模型：交叉复核后仍有分歧时，由它做最终判断
# 选用与三个投票模型都不同厂商的智谱 GLM（通过百炼调用），避免偏向某一方
arbiter:
  name: glm
  provider: openai
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  model: glm-5.3
  max_tokens: 2048              # 该模型强制开启思考，需要留足 token
  # 百炼价格页暂未列出 glm-5.3 的单价，请在百炼控制台查到后填写 price_in / price_out
  mock_accuracy: 0.9
  enabled: true

pipeline:
  concurrency: 8            # 同时进行的 API 请求数上限
  min_votes: 2              # 至少需要几个模型给出有效结果才能自动采纳
  # 级联调用：首轮先只调用列出的模型，它们全部一致就直接采纳，不再调用其余模型；不一致才调用全部模型。
  # 例：cascade: [local, deepseek]（有训练数据时，本地小模型不花钱）或 cascade: [deepseek, qwen]
  # 留空表示不级联，每条都调用全部模型
  cascade: []
  # 首轮出现分歧时怎么处理：
  #   human   -> 直接转人工审核（默认）
  #   review  -> 交叉复核后投票，仍不通过再仲裁
  #   arbiter -> 跳过复核，直接交给仲裁模型
  # 实测 600 条金标准中的 131 条分歧样本：复核改对 13 条、改错 10 条，几乎没有净收益，
  # 而分歧样本整体准确率只有 41%，交给人工最划算。
  disagreement_action: human
  cross_review: true        # 出现分歧时是否进行交叉复核（仅 review 策略生效）
  accept_threshold: 0.6     # 复核后：过半模型同意 且 加权得票占比 >= 该值 -> 自动采纳
  use_arbiter: true         # 复核后仍未通过时，是否交给仲裁模型
  arbiter_threshold: 0.7    # 仲裁模型置信度 >= 该值才采纳，否则转人工
  timeout: 60               # 单次请求超时（秒）
  max_retries: 3            # 网络错误 / 429 / 5xx 时的重试次数

# 动态示例：每条文本从已标注数据中检索最相似的 k 条放进提示词（需要一份带 text/label 列的 csv 或 jsonl）
# 有了这份数据，还可以在 models 中加入本地小模型作为额外一票：
#   - name: local
#     provider: local          # TF-IDF + 逻辑回归，本机训练，不调用 API；训练集默认取 fewshot.path
# fewshot:
#   path: data/my_labeled.csv
#   k: 6
#   max_chars: 300             # 每条示例最多保留的字符数

cache:
  enabled: true             # 缓存模型回复：相同输入不重复调用，节省费用
  path: .cache/llm_cache.jsonl

# 仅 mock 模式使用：假模型根据关键词决定“正确答案”，再按 mock_accuracy 随机犯错
mock:
  keywords:
    售后: [退货, 退款, 换货, 维修, 返修]
    投诉: [太差, 投诉, 态度, 骗, 不回, 失望, 恶劣]
    建议: [建议, 希望, 能不能增加, 最好能]
    # 其他：未命中任何关键词时默认归入最后一个类别
    咨询: [请问, 多少钱, 什么时候, 怎么, 吗, 是否]
