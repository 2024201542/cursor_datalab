# 股吧情绪：分类标准由千问从训练集样本自动归纳（每类 25 条），未经人工修改，用来和手写标准对比
base: econ_finfe.yaml
task:
  name: 股吧帖子情绪分类（自动归纳）
  description: 对股吧或财经论坛中的用户发帖进行情绪极性判断，每条数据仅归入中性、消极或积极三类之一。
  labels:
  - name: 中性
    definition: 包含客观事实陈述、行业分析、无明确涨跌倾向的疑问句、纯调侃/吃瓜/无关内容、以及虽含情绪词但实际为反讽或旁观者视角的言论。特别注意：单纯的指令性操作（如'买入'）若无强烈情感修饰，在此批数据中常标为中性；对他人的嘲讽若未直接表达自身亏损痛苦或看空观点，也常标为中性。
    examples:
    - 各大智能手机厂商将在今年6月进行价格调整。因此，今年下半年推出的大部分智能手机的价格将高于一年前推出的同类产品。
    - 提前终止减持计划后还能继续减持吗？
    - 怀恨在心恶意诋毁大通的小人们。看着爷爷赚钱是不是羡慕嫉妒恨啊？哈哈哈
    - 买入奇正藏药！
    counter_examples:
    - 四只股票三只涨就你一个在赔钱
    - 此处不能看空，强力拉升
    - 塔麻的，加仓，开始满仓干，开足马力干，有本事跌到退市我就认输
  - name: 消极
    definition: 表达亏损痛苦、愤怒、失望、恐慌情绪；明确看空后市、认为主力出货/洗盘/骗人；抱怨公司管理层（董秘等）或股价表现不佳；使用辱骂性词汇宣泄不满。核心特征是负面情绪指向投资结果或市场行为。
    examples:
    - 3.6都不保，3.77买的可是真没指望了
    - 恶炒烂股，控盘为王，哪来的价值投资，骗百姓！
    - 刚卖就涨.我可能被监控了吧。
    - SB国信有本事跌停呀，别人跌你更有理由去跌了
    counter_examples:
    - 你那点水平就不要在吧里发分析了
    - 祝越秀早日突破100元，老子不玩了
    - 未知太多。通胀都是找低估值的资产，股票也是。（有价值的）你不要老外也要。现在是全球经济了。门是开起的！
  - name: 积极
    definition: 表达看好后市、信心满满、鼓励他人或自我激励；预测涨停、上涨、突破；赞美公司基本面、技术形态或龙头地位；即使当前亏损但依然保持乐观态度。核心特征是正面情绪指向投资收益或市场预期。
    examples:
    - 加油安安，虽然我一直亏钱一个月了，我可没骂过你，不信你看我发言记录。你要加油。
    - 这形态很完美啊，各种均线突破，下跌趋势转为上涨趋势，这么完美的趋势，后市怎么走呢
    - 东方电子的价值回归必然会让我再次赚大钱！
    - 明天一字板，没上车的没机会了。
    counter_examples:
    - 耐心等待吧，放一年再说
    - 算力资源服务化的推进以及数据流通融合的加速将降低算力与数据使用成本，加速下游大数据应用产业发展与创新
    - 海南板块庄控盘收票，赛马落户就会整体起动。
  rules:
  - 若帖子仅为客观新闻转载、行业数据分析或无倾向性的疑问句，必须标为中性。
  - 若帖子包含辱骂、抱怨亏损、指责主力/庄家/董秘欺诈或看空股价，必须标为消极。
  - 若帖子表达看涨预期、鼓励持股、赞美技术面/基本面或自我打气，必须标为积极。
  - 对于反讽或吃瓜性质的吐槽（如嘲笑他人、围观热闹），若无明确自身投资立场，优先标为中性。
  - 简单的交易指令（如'买入'、'卖出'）若无强烈情绪形容词修饰，在此标准下倾向于标为中性。
  - 即使提及当前亏损，若结尾落在鼓励、看好未来或理性分析上，应标为积极而非消极。
pipeline:
  disagreement_action: human
  cross_review: false
  use_arbiter: false
