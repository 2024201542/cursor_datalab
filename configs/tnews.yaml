# CLUE TNEWS 今日头条新闻标题分类（15 类）
# 模型、流水线、缓存等配置沿用 config.yaml，这里只定义分类任务
base: ../config.yaml

task:
  name: 新闻标题分类（TNEWS）
  description: 根据一条今日头条新闻标题，判断它属于哪个新闻频道。每条标题只能归入一个类别。

  labels:
    - name: 故事
      definition: 民间故事、情感故事、历史趣闻、传奇轶事等叙事性内容。
    - name: 文化
      definition: 历史、文学、书画、收藏、民俗、传统文化、哲学思想等。
    - name: 娱乐
      definition: 明星、影视、综艺、音乐、网红八卦等娱乐圈内容。
    - name: 体育
      definition: 足球、篮球等体育赛事、运动员、体育新闻。
    - name: 财经
      definition: 宏观经济、企业经营、商业、金融、理财、创业等（个股与股市行情除外）。
    - name: 房产
      definition: 楼市、房价、买房卖房、租房、装修、物业、小区等。
    - name: 汽车
      definition: 汽车产品、购车用车、交通驾驶、车辆维修保养等。
    - name: 教育
      definition: 学校、考试、升学、学习方法、教师、留学、育儿教育等。
    - name: 科技
      definition: 互联网、手机数码、人工智能、科学研究、新技术产品等。
    - name: 军事
      definition: 军队、武器装备、战争、国防、军事冲突等。
    - name: 旅游
      definition: 旅行目的地、景点、出行攻略、酒店民宿、地方风光等。
    - name: 国际
      definition: 其他国家的政治、外交、社会新闻及国际关系。
    - name: 股票
      definition: 股市行情、个股分析、A股美股港股、炒股操作等。
    - name: 农业
      definition: 种植、养殖、农村、农产品、农民、农业政策等。
    - name: 电竞
      definition: 电子游戏、手游、电竞赛事、游戏角色和玩法等。

  rules:
    - 涉及股市、个股、大盘的归为“股票”；其余经济、商业、金融内容归为“财经”。
    - 涉及游戏中的武器、角色的归为“电竞”，现实中的武器装备归为“军事”。
    - 其他国家的军事冲突，以军事行动为主体的归为“军事”，以政治外交为主体的归为“国际”。

mock:
  keywords: {}
