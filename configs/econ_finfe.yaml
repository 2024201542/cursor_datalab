# 中文股民情绪分类（BBT-FinCUGE FinFE）
# 文本：股吧 / 财经社交媒体上的散户发帖
# 用途：行为金融——构建投资者情绪指数，研究情绪与收益率、成交量、股价崩盘风险的关系
# 数据：python scripts/prepare_econ.py  →  data/econ_finfe_gold.csv
base: ../config.yaml

task:
  name: 股吧帖子情绪分类
  description: 给定一条股吧或财经社交媒体上的投资者发帖，判断发帖人对股票或市场的情绪是积极、消极还是中性。每条只能归入一个类别。

  labels:
    - name: 积极
      definition: 看多、乐观、满意，如看好上涨、准备买入或持有、庆祝赚钱、夸赞公司或走势。
      examples:
        - 人气(^_^)不错嘛，突破有效！
        - 长期拿着就行。一年不翻倍我剁手
    - name: 消极
      definition: 看空、悲观、不满，如抱怨亏损、割肉、骂庄家或公司、担心下跌、嘲讽市场。
      examples:
        - 干的漂亮大盘创新高你在这大型股灾现场
        - 现在这市场大资金抱团，权重的天下，指数涨中小个股普跌暴跌，散户的生存空间愈发艰难了，牛逼的改革……
    - name: 中性
      definition: 没有明显的看多或看空倾向，如陈述事实、提问、闲聊、与投资无关的调侃，或多空观点并存。
      examples:
        - 人喝的茅台飞天了，车喝的油缺钻地！
        - 我屏蔽的人还可以出现在我的眼前发言，太假了，这些拖真可以。

  rules:
    - 注意股吧常见的反讽："干得漂亮""牛逼的改革"等字面褒义、实际抱怨的归为"消极"。
    - 只报价格、代码、时间或单纯提问，没有态度的归为"中性"。
    - 对发帖人自身持仓的情绪优先于对大盘的评论。

mock:
  keywords: {}
